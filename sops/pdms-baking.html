<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDMS 固化與脫模標準流程</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <a href="../index.html" class="text-blue-500 hover:underline mb-4 inline-block">← 回首頁</a>
        <h1 class="text-3xl font-bold mb-6 text-gray-800">PDMS 固化與脫模標準流程</h1>
        
        <h2 class="text-xl font-bold text-gray-700 mt-4 mb-2">📌 目的</h2>
        <p class="mb-4">確保微流體晶片成型完整，避免模具破裂。</p>

        <h2 class="text-xl font-bold text-gray-700 mt-4 mb-2">📝 步驟</h2>
        <ul class="list-decimal pl-5 mb-4 space-y-1">
            <li>以 10:1 比例均勻混拌 PDMS 與固化劑。</li>
            <li>放入真空烘箱抽氣 30 分鐘去除氣泡。</li>
            <li>置於 80°C 烤箱烘烤 2 小時。</li>
        </ul>

        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mt-6">
            <strong>🚨 學長防呆警告：</strong> 烤完請等它降溫再拔！硬拔把模具弄破的話，老闆會把你的頭當模具烤。
        </div>
    </div>
</body>
</html>
